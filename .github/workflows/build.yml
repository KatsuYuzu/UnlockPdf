name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UnlockPdf.sln

      - name: Build
        run: dotnet build UnlockPdf.sln -c Release --no-restore

      - name: Publish smoke check
        run: dotnet publish src/UnlockPdf/UnlockPdf.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/win-x64

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/win-x64 -File
          if ($files.Count -ne 1 -or $files[0].Name -ne 'UnlockPdf.exe') {
            throw 'Publish output must contain only UnlockPdf.exe.'
          }
